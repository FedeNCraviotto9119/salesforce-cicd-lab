
name: Validar Salesforce PROD

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate PR against gPROD
    environment: 
      name: production-validation
      deployment: false
      if: github.event.pull_request.head.repo.full_name == github.repository
      runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          check-latest: true
          package-manager-cache: false

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Install SFDX Git Delta
        run: echo y | sf plugins install sfdx-git-delta

      - name: Generate PROD Delta
        run: |
          mkdir -p delta

          BASE_COMMIT=$(git merge-base HEAD origin/main)

          sf sgd source delta \
            --from "$BASE_COMMIT" \
            --to HEAD \
            --source-dir force-app \
            --output-dir delta

      - name: Show generated package
        run: |
          cat delta/package/package.xml

      - name: Check Delta
        id: delta_check
        run: |
          if grep -q '<members>' delta/destructiveChanges/destructiveChanges.xml; then
            echo "Destructive changes require manual review."
            exit 1
          fi

          if grep -q '<members>' delta/package/package.xml; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No Salesforce metadata changes."
          fi

      # Next: authenticate gPROD and validate deployment.


      - name: Authenticate Salesforce PROD
        if: steps.delta_check.outputs.has_changes == 'true'
        env:
          SF_AUTH_URL: ${{ secrets.SF_PROD_AUTH_URL }}
        run: |
          printf '%s' "$SF_AUTH_URL" |
            sf org login sfdx-url \
              --sfdx-url-stdin - \
              --alias gPROD

      - name: Validate PROD Deployment
        if: steps.delta_check.outputs.has_changes == 'true'
        run: |
          sf project deploy validate \
            --manifest delta/package/package.xml \
            --target-org gPROD \
            --test-level RunSpecifiedTests \
            --tests CicdHelloTest \
            --wait 30
