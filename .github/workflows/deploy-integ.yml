name: Deploy Salesforce INTEG

on:
  push:
    branches:
      - integ

permissions:
  contents: read

concurrency:
  group: salesforce-integ-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to gINTEG
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          check-latest: true
          package-manager-cache: false

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Authenticate Salesforce INTEG
        env:
          SF_AUTH_URL: ${{ secrets.SF_INTEG_AUTH_URL }}
        run: |
          printf '%s' "$SF_AUTH_URL" |
            sf org login sfdx-url \
              --sfdx-url-stdin - \
              --alias gINTEG

      - name: Deploy CicdHello to INTEG
        run: |
          sf project deploy start \
            --metadata ApexClass:CicdHello \
            --target-org gINTEG \
            --wait 30
