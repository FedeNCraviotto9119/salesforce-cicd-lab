name: Validar Salesforce INTEG

on:
  pull_request:
    branches:
      - integ

permissions:
  contents: read

jobs:
  validate:
    name: Validate PR against gINTEG
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          check-latest: true
          package-manager-cache: false

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Authenticate Salesforce INTEG
        env:
          SF_AUTH_URL: ${{ secrets.SF_INTEG_AUTH_URL }}
        run: |
          printf '%s' "$SF_AUTH_URL" |
            sf org login sfdx-url \
              --sfdx-url-stdin - \
              --alias gINTEG
      
      - name: Validate Apex deployment
        run: |
          sf project deploy start \
            --metadata ApexClass:CicdHello \
            --target-org gINTEG \
            --dry-run \
            --test-level RunLocalTests \
            --wait 30